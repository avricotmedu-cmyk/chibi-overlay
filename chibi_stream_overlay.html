const W = 120, H = 62;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const party = document.createElement('canvas'); party.width = W; party.height = H;
const pc = party.getContext('2d');
const cowok = new Image(), cewek = new Image();
const rnd = (a,b) => a + Math.random()*(b-a);
const embers = Array.from({length:22}, () => [rnd(0,W), rnd(0,H), rnd(0.3,0.8)]);

function resize(){
  cv.width = Math.ceil(innerWidth / CFG.SCALE); cv.height = H;
  cv.style.width = (cv.width*CFG.SCALE) + 'px'; cv.style.height = (H*CFG.SCALE) + 'px';
  cv.style.bottom = CFG.BOTTOM + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();
if (location.hash === '#preview') document.body.style.background = '#e8edf5';

function flame(t){
  for (let x=0; x<W; x++){
    const hh = 16 + 7*Math.sin(x*0.35 + t*0.9) + 4*Math.sin(x*0.9 - t*1.7);
    for (let y=0; y<Math.floor(hh); y++){
      const yy = H-1-y, rel = y/Math.max(hh,1);
      if (rel>0.8 && (x+yy)%2) continue;
      if (rel>0.55 && (x*3+yy)%3===0) continue;
      pc.fillStyle = rel<0.5 ? '#f4b05c' : '#e48068';
      pc.fillRect(x, yy, 1, 1);
    }
  }
}
function drawEmbers(t){
  pc.fillStyle = '#e2785a';
  for (const e of embers){
    e[1] -= e[2];
    if (e[1] < 2){ e[0] = rnd(2,W-3); e[1] = H-4; }
    const x = Math.floor(e[0] + 2*Math.sin(t+e[0])), y = Math.floor(e[1]);
    for (const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]])
      if (x+dx>=0 && x+dx<W && y+dy>=0 && y+dy<H) pc.fillRect(x+dx, y+dy, 1, 1);
  }
}
// pose jalan/lari dari 1 sprite diam (potong badan + kaki)
function pose(spr, ox, oy, phase, mode, lean){
  const w = spr.width, h = spr.height;
  const foot0 = Math.floor(h*0.80), split = Math.floor(h*0.55), mid = Math.floor(w/2);
  let l = [0,0], up = 0;
  if (mode==='run'){ l = [[4,0],[1,1],[0,4],[1,1]][phase]; up = (phase===1||phase===3)?1:0; }
  else if (mode==='walk'){ l = [[2,0],[0,0],[0,2],[0,0]][phase]; }
  else { up = phase%2; }
  const px = 3, py = 5, d = (sx,sy,sw,sh,dx,dy) => pc.drawImage(spr,sx,sy,sw,sh,ox+dx,oy+dy,sw,sh);
  d(0,0,w,split, px+lean, py-up);
  d(0,split,w,foot0-split, px, py+split-up);
  d(0,foot0,mid,h-foot0, px, py+foot0-l[0]);
  d(mid,foot0,w-mid,h-foot0, px+mid, py+foot0-l[1]);
}
function drawParty(t, mode, dir, phase){
  pc.clearRect(0,0,W,H);
  if (CFG.FIRE){ flame(t); drawEmbers(t); }
  const lean = (mode==='run'?1:0)*dir;
  const [xb,xg] = dir>0 ? [66,34] : [34,66];
  pose(cowok, xb, H-cowok.height-5, phase, mode, lean);
  pose(cewek, xg, H-cewek.height-5, (phase+2)%4, mode, lean);
}
// patroli: jalan / lari / diam acak, balik arah kalau mentok
const P = {x:0, dir:1, mode:'idle', left:6, n:0};
function tick(){
  P.n++; P.left--;
  const x1 = cv.width - W;
  if (P.mode!=='idle'){
    P.x += P.dir*(P.mode==='run'?CFG.RUN:CFG.WALK);
    if (P.x<=0 || P.x>=x1){ P.x = Math.min(Math.max(P.x,0),x1); P.dir*=-1; P.mode='idle'; P.left=8; }
  }
  if (P.left<=0){
    P.mode = ['walk','walk','run','idle'][Math.floor(Math.random()*4)];
    P.left = P.mode!=='idle' ? Math.floor(rnd(20,46)) : Math.floor(rnd(8,17));
    if (P.mode!=='idle' && Math.random()<0.3) P.dir*=-1;
  }
  const step = P.mode==='run'?1 : P.mode==='walk'?3 : 4;
  drawParty(P.n*0.25, P.mode, P.dir, Math.floor(P.n/step)%4);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(party, Math.round(P.x), 0);
}
const load = (img,src) => new Promise(r => { img.onload = r; img.src = src; });
Promise.all([load(cowok,SPR.cowok), load(cewek,SPR.cewek)]).then(() => setInterval(tick, CFG.TICK));
